<html>
<head>
    <script type="text/javascript">
        var pociag = {
        ile_wagonow: 10,
        predkosc: 120,
        km_trasy: 500,
        pociag_wyswietl_trzaskalski: function ()
        {
        document.write('Pociąg ma ' + this.ile_wagonow + ' wagonów.')
        document.write('<br>Pociąg jedzie z prędkością ' + this.predkosc + ' km/h.')
        document.write('<br>Pociąg przejechał ' + this.km_trasy + ' km trasy.')
        }
        }
        pociag.pociag_wyswietl_trzaskalski();
    </script>
</head>
<body>
    <br>
    Programowanie obiektowe. <br>
    Obiekt to pociag<br>
    Pola:ile_wagonow<br>
    Pola:predkosc<br>
    Pola:km_trasy
    metoda: pociag_wyswietl_trzaskalski<br>
</body>
</html>
