&lt;!DOCTYPE html&gt;

&lt;html lang="pl-PL"&gt;
&lt;head&gt;
&lt;meta charset="utf-8"&gt;
&lt;title&gt;Trza Z18_JS&lt;/title&gt;

&lt;script&gt;function okno_zamknij_trza(){window.close();}&lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div style="color:navy;font-size:40px;"&gt;
&lt;script language="JavaScript"&gt;
var a=parseFloat(prompt("a=",""));
var b=parseFloat(prompt("b=",""));
function suma_trz(a, b) { return a + b; }
function odejmowanie_trz(a, b) { return a - b; }
function mnozenie_trz(a, b) { return a * b; }
function od_kwadratu_trz(a, b) { return a*a; }
function reszta_z_dzielenia_a_przez_b_trz(a, b) { return a % b; }
document.write("a="+a+" b="+b+"&lt;br&gt;");
document.write("suma="+suma_trz(a,b)+"&lt;br&gt;");
document.write("różnica="+odejmowanie_trz(a,b)+"&lt;br&gt;");
document.write("iloczyn="+mnozenie_trz(a,b)+"&lt;br&gt;");
document.write(a+"^2 = "+od_kwadratu_trz(a,b)+"&lt;br&gt;");
document.write(b+"^2 = "+od_kwadratu_trz(b,a)+"&lt;br&gt;");
document.write("reszta z dzielenia "+a+" przez "+b+" = "+reszta_z_dzielenia_a_przez_b_trz(a,b)+"&lt;br&gt;");
&lt;/script&gt;
&lt;/div&gt;
&lt;p&gt;&lt;input type="button" value="zamknij okno" onclick="okno_zamknij_trza()"&gt;&lt;/p&gt;
&lt;/body&gt;
