<!DOCTYPE html>

<html lang="pl-PL">
<head>
<meta charset="utf-8">
<title>Trza Z19_JS</title>
<link rel="stylesheet" href="styl.css">
<script type="text/javascript">
function Pole_trza()
{
var a_trz= parseFloat(document.getElementById('dlugosc').value);
var b_trz= a_trz*a_trz;
document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_trz.toFixed(2)+" cm^2";
}
function obwod_trza()
{
var a_trz= parseFloat(document.getElementById('dlugosc').value);
var b_trz= 4*a_trz;
document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_trz.toFixed(2)+" cm";
}
</script>
<script>function okno_zamknij_trza(){window.close();}</script>
</head>
<body>
<h1>Wszystko o KWADRACIE</h1>
Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br>
<input type="button" name="pole" value="Oblicz pole" onclick="Pole_trza()"><br><br>
<input type="button" name="obwod" value="Oblicz obwod" onclick="obwod_trza()"><br><br>
<div style="color:red;font-size:40px;" id="nazwa"></div>
<p><input type="button" value="zamknij okno" onclick="okno_zamknij_trza()"></p>
</body>
</html>
