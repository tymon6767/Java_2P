<body>
<textarea cols="90" rows="24" readonly>
&lt;!DOCTYPE html&gt;
&lt;!-- Imię Trza 27.10.2026 | Zadanie 26 --&gt;
&lt;html lang="pl-PL"&gt;
&lt;head&gt;
&lt;meta charset="utf-8"&gt;
&lt;title&gt;Trza Z26_JS&lt;/title&gt;
&lt;script type="text/javascript"&gt;
function ramie_trz(a,b,h) { return Math.sqrt(h*h+Math.pow(Math.abs(a-b)/2,2)); }
function Pow_trza(a,b,h) { return (a+b)*h/2; }
function Obw_trza(a,b,h) { return a+b+2*ramie_trz(a,b,h); }
function dane_trz() { return [parseFloat(document.getElementsByName("a")[0].value), parseFloat(document.getElementsByName("b")[0].value), parseFloat(document.getElementsByName("h")[0].value)]; }
function licz_trz()
{
var d=dane_trz();
document.getElementsByName("pole")[0].value=Pow_trza(d[0],d[1],d[2]).toFixed(2);
document.getElementsByName("obwod")[0].value=Obw_trza(d[0],d[1],d[2]).toFixed(2);
}
function pisz_trz()
{
var d=dane_trz();
document.open();
document.write("&lt;h2&gt;Trapez równoramienny&lt;/h2&gt;a="+d[0]+" b="+d[1]+" h="+d[2]+"&lt;br&gt;Pole = "+Pow_trza(d[0],d[1],d[2]).toFixed(2)+"&lt;br&gt;Obwód = "+Obw_trza(d[0],d[1],d[2]).toFixed(2)+"&lt;br&gt;&lt;br&gt;&lt;input type='button' value='wróć' onclick='location.reload()'&gt;");
document.close();
}
&lt;/script&gt;
&lt;script&gt;function okno_zamknij_trza(){window.close();}&lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;h3&gt;Trapez równoramienny&lt;/h3&gt;
&lt;form name="trapez"&gt;
podstawa dolna a = &lt;input size="8" name="a"&gt;&lt;br&gt;&lt;br&gt;
podstawa górna b = &lt;input size="8" name="b"&gt;&lt;br&gt;&lt;br&gt;
wysokość h = &lt;input size="8" name="h"&gt;&lt;br&gt;&lt;br&gt;
&lt;input type="button" value="Oblicz (formularz)" onclick="licz_trz()"&gt;
&lt;input type="button" value="Pokaż (document.write)" onclick="pisz_trz()"&gt;&lt;br&gt;&lt;br&gt;
Pole = &lt;input size="10" name="pole"&gt; Obwód = &lt;input size="10" name="obwod"&gt;
&lt;/form&gt;
&lt;p&gt;&lt;input type="button" value="zamknij okno" onclick="okno_zamknij_trza()"&gt;&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;
&lt;!-- Trza Z26_JS --&gt;
</textarea><br>
<input type="button" value="zamknij okno" onclick="okno_zamknij_trza()"/>
</body>
</html>
