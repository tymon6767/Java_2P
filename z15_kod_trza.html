<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 15 - Trzaskalski</title>
</head>
<body>
<div style="color:green; font-size:30px;">
<script language="JavaScript">

var m_trz = prompt("Podaj wartość m (liczba naturalna > 0):", "3");
var m = parseInt(m_trz);

if (m > 0) {
    var ulamek = 2 * m;
    document.write("1/" + m + " = 1/" + ulamek + " + 1/" + ulamek);
} else {
    document.write("Podano niepoprawną wartość m.");
}
</script>
</div>
</body>

</textarea>
