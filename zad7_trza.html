<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie 7 Trzaskalski</title>
    <script type="text/javascript">
        function show_alert() { alert("Uwaga!"); }
    </script>
</head>
<body>
    <h2>Zadanie 7 - Alert Box</h2>
    <p>
        <b>Zastosowanie:</b> Okienko <i>alert</i> jest używane do przekazywania informacji użytkownikowi.
        Użytkownik musi nacisnąć OK aby potwierdzić jej przeczytanie.
    </p>
    <input type="button" onclick="show_alert()" value="Pokaż Alert Box" />
    <br><br>
    <input type="button" value="zamknij okno" onclick="window.close()" />
</body>
</html>
