<!DOCTYPE html>

<html lang="pl-PL" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Trzaskalski Z35_JS</title>
</head>
<body>
  <textarea cols="90" rows="24">
    <div style="color:red;font-size:50px;">
        <script>
            var x = prompt("Podaj liczbę x:", "");
            var a_dana_trza = parseFloat(x);

            document.write("Czytana liczba x = " + a_dana_trza + "<br>");

            if (a_dana_trza > 0) {
                document.write("Czytana liczba jest większa od 0.<br>");
            } else if (a_dana_trza === 0) {
                document.write("Czytana liczba jest równa 0.<br>");
            } else {
                document.write("Czytana liczba jest mniejsza od 0.<br>");
            }
        </script>
    </div>
    </textarea>
</body>
</html>
