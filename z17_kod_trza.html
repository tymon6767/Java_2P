&lt;h3&gt;Zadanie 17 - pytania teoretyczne&lt;/h3&gt;
&lt;p&gt;&lt;b&gt;1. Cztery sposoby wyprowadzania danych w JS&lt;/b&gt;&lt;br&gt;
z użyciem &lt;u&gt;document.write()&lt;/u&gt;; z użyciem okienka &lt;u&gt;alert()&lt;/u&gt;; do &lt;u&gt;okienek formularza&lt;/u&gt;; do &lt;u&gt;tabeli&lt;/u&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;2. Czym jest funkcja w JS&lt;/b&gt;&lt;br&gt;
a) Jest to &lt;u&gt;zbiór zgrupowanych instrukcji&lt;/u&gt;, które uruchamiamy, podając ich nazwę.&lt;br&gt;
b) Każda funkcja po wywołaniu &lt;u&gt;wykonuje swój wewnętrzny kod&lt;/u&gt;.&lt;br&gt;
c) Funkcja może mieć &lt;u&gt;argumenty&lt;/u&gt;, które wchodzą do wnętrza i są tam przetwarzane, np. suma_trz(a, b).&lt;br&gt;
d) Może (nie zawsze) &lt;u&gt;zwrócić obliczoną wartość&lt;/u&gt; zapisaną po słowie kluczowym &lt;u&gt;return&lt;/u&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;3. Metody getElementsByName, getElementById, getElementsByTagName&lt;/b&gt;&lt;/p&gt;
&lt;table border="1" cellpadding="5"&gt;
&lt;tr&gt;&lt;th&gt;Metoda&lt;/th&gt;&lt;th&gt;Opis&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;u&gt;getElementById("id")&lt;/u&gt;&lt;/td&gt;&lt;td&gt;dostęp do elementu o konkretnej wartości atrybutu id&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;u&gt;getElementsByTagName("znacznik")&lt;/u&gt;&lt;/td&gt;&lt;td&gt;dostęp do wszystkich elementów o danym typie znacznika, np. P lub DIV&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;u&gt;getElementsByName("nazwa")&lt;/u&gt;&lt;/td&gt;&lt;td&gt;dostęp do wszystkich elementów o konkretnej wartości atrybutu name&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;&lt;b&gt;4. Właściwości innerHTML, innerText, className&lt;/b&gt;&lt;br&gt;
&lt;b&gt;innerHTML&lt;/b&gt; - &lt;u&gt;odczyt, zmiana, wstawienie lub usunięcie kodu HTML&lt;/u&gt; z danego elementu, np. w tabeli.&lt;br&gt;
&lt;b&gt;innerText&lt;/b&gt; - określa &lt;u&gt;ciąg znaków&lt;/u&gt;, który zostanie umieszczony w elemencie.&lt;br&gt;
&lt;b&gt;className&lt;/b&gt; - określa &lt;u&gt;klasę CSS&lt;/u&gt; użytą do prezentacji elementu.&lt;/p&gt;

&lt;p&gt;&lt;input type="button" value="zamknij okno" onclick="okno_zamknij_trza()"&gt;&lt;/p&gt;
